# BeePrepared - the whole application in one command.
#
#   docker compose up
#
# That gives you the backend and the frontend. The API runs its own worker pool
# and an in-process event bus, so there is no broker and no database server to
# stand up. State lives in SQLite on the `beedata` volume, alongside every
# uploaded source and every rendered export.
#
# To run the distributed shape instead - Redis carrying the queue and the event
# stream between an API and separate Celery workers - add the overlay:
#
#   docker compose -f docker-compose.yml -f docker-compose.celery.yml up
#
# Both are the same image and the same code. Which one you get is decided by
# CELERY_ENABLED and REDIS_URL, and by nothing else.

name: beeprepared

services:
  api:
    build:
      context: ./backend
    container_name: beeprepared-api
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --proxy-headers
    env_file:
      - path: .env
        required: false
    environment:
      BEE_DATA_DIR: /data
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # No broker, so the API starts its own worker pool in-process.
      REDIS_URL: ""
      CELERY_ENABLED: "false"
      # Left empty on purpose. An unset key makes each install mint and persist
      # a private one on the volume; a key written here would be public, and a
      # download link is unforgeable only while its key is not.
      SIGNING_SECRET: ${SIGNING_SECRET:-}
    volumes:
      - beedata:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # No dependency on the API: this serves an app that talks to the backend from
  # the browser, so it has nothing to wait for and should come up either way.
  frontend:
    build:
      context: ./frontend
    container_name: beeprepared-frontend
    command: node server.js
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  beedata:
