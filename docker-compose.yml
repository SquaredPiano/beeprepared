# BeePrepared - the full stack.
#
#   docker compose up            redis + api + worker + beat + frontend
#   docker compose up api        api only; it runs its own worker pool
#
# There is no database service: state lives in SQLite on the `beedata` volume,
# alongside every uploaded source and rendered export. One command, no accounts.

name: beeprepared

x-backend: &backend
  build:
    context: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    BEE_DATA_DIR: /data
    REDIS_URL: redis://redis:6379/0
    CELERY_ENABLED: "true"
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    SIGNING_SECRET: ${SIGNING_SECRET:-change-me-in-production}
  volumes:
    - beedata:/data
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    container_name: beeprepared-redis
    command: redis-server --save "" --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    <<: *backend
    container_name: beeprepared-api
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --proxy-headers
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    <<: *backend
    command: celery -A backend.celery_app:celery_app worker --loglevel=info --concurrency=4

  beat:
    <<: *backend
    command: celery -A backend.celery_app:celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
    container_name: beeprepared-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  beedata:
